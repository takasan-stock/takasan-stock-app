name: 日本株スクリーナー 定期スキャン

on:
  schedule:
    # GitHub Actionsのcronは混雑時に数時間ずれることがあるため、
    # 「その日の夜のうちに確実に1回終わらせる」狙いで、市場終了後〜夜22時台まで
    # 複数の時刻を予約する。scan.py側で「当日すでにスキャン済みならスキップ」するため、
    # 実際にスキャンが走るのは1日1回だけ（最初に時間内に起動できたもの）。
    - cron: "7 6 * * 1-5"
    - cron: "23 7 * * 1-5"
    - cron: "37 8 * * 1-5"
    - cron: "53 9 * * 1-5"
    - cron: "11 11 * * 1-5"
    - cron: "29 12 * * 1-5"
    - cron: "43 13 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: トリガー種別を表示（定期実行か手動実行かを記録）
        run: |
          echo "トリガー種別: ${{ github.event_name }}"
          echo "実行開始時刻(UTC): $(date -u)"

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scan.txt

      - name: JPX取得ガード付き全銘柄スキャン実行
        id: core_scan
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python safe_scan.py
          if [ -f .scan_skipped ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "対象取引日: $(cat .scan_skipped) / 重複予約のため本体スキャンを省略"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: スクリーニング4系統サマリーと重複分析を作成
        if: steps.core_scan.outputs.skipped != 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python category_review.py

      - name: 4系統サマリーへ総合スコアを付与
        if: steps.core_scan.outputs.skipped != 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python overall_score.py

      - name: 実戦スコアの事後成績を記録
        if: steps.core_scan.outputs.skipped != 'true'
        id: performance_tracker
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python performance_tracker.py

      - name: 実戦検証エラーを警告
        if: steps.performance_tracker.outcome == 'failure'
        run: echo "::warning::実戦検証の更新に失敗しました。コアの全銘柄スキャンと総合スコア更新は正常完了しています。"

      - name: 実行結果サマリー
        if: always()
        run: |
          if [ "${{ steps.core_scan.outputs.skipped }}" = "true" ]; then
            echo "## ⏭️ 重複予約をスキップ" >> "$GITHUB_STEP_SUMMARY"
            echo "この対象取引日はすでに本スキャン完了済みです。後段の集計・スコア・実戦検証も再実行していません。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ 本スキャン実行" >> "$GITHUB_STEP_SUMMARY"
            echo "全銘柄スキャンから4系統集計・総合スコア・実戦検証まで実行しました。" >> "$GITHUB_STEP_SUMMARY"
          fi
