services:
  - type: web
    name: takasan-stock-hunter-api
    runtime: python
    rootDir: web_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SPREADSHEET_ID
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: takasan-stock-hunter-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
