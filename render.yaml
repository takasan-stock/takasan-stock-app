services:
  - type: web
    name: takasan-stock-hunter-api
    runtime: python
    plan: free
    region: singapore
    rootDir: web_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - fromGroup: takasan-stock-hunter-secrets

  - type: web
    name: takasan-stock-hunter-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
